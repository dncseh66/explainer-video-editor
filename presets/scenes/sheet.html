<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Scene kit</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Patrick+Hand+SC&display=swap" rel="stylesheet">
<style>
  body { margin:0; background:#2F2B28; color:#F4EEE2; font:14px/1.35 system-ui, sans-serif }
  h1 { font-size:20px; margin:18px 20px 4px } p.k { margin:0 20px 10px; color:#cfc6b8 }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(560px,1fr)); gap:16px; padding:0 20px 24px }
  .card { background:#1f1c1a; border-radius:10px; overflow:hidden }
  .frame { position:relative; width:100%; aspect-ratio:16/9; overflow:hidden }
  .stage { position:absolute; left:0; top:0; width:1920px; height:1080px; transform-origin:0 0 }
  .stage svg { position:absolute; inset:0; width:1920px; height:1080px }
  .cap { padding:8px 12px } .cap b { display:block } .cap small { color:#bdb3a5 }
</style></head>
<body>
<h1>Scene kit — backgrounds, props, infographics, colour moods</h1>
<p class="k">Every background is drawn by <code>W.bg.*</code> with a colour mood from <code>W.MOODS</code>; characters come from <code>W.person</code>.</p>
<div class="grid" id="grid"></div>
<script src="../characters/person.js"></script>
<script src="scenes.js"></script>
<script>
const css = document.createElement('style'); css.textContent = W.info.CSS; document.head.appendChild(css);
const M = W.MOODS;
let n = 0;
const ppl = (list) => list.map(([o, x, y, s, flip]) => { const c = 'p' + (n++); return { c, o, x, y, s, flip, svg: W.person(c, o) }; });
const scenes = [
  ['Dungeon cell', 'dungeonWarm · bg.dungeon', (t) => W.bg.dungeon(M.dungeonWarm, { t }), ppl([[{ outfit: 'rags', expr: 'sad' }, 760, 900, 1.5], [{ outfit: 'rags', hair: 'short', facial: 'stubble' }, 1000, 930, 1.6, true], [{ outfit: 'rags', expr: 'sleep' }, 1300, 960, 1.6]])],
  ['Vaulted hall (refectory)', 'hallSage · bg.vaultHall + table, stools, bowls', (t) => W.bg.vaultHall(M.hallSage, { t }) + W.prop.stool(560, 960, 1, M.hallSage) + W.prop.stool(1360, 960, 1, M.hallSage), ppl([[{ outfit: 'robe' }, 560, 900, 1.7], [{ outfit: 'robe', expr: 'sleep' }, 960, 880, 1.7], [{ outfit: 'robe' }, 1360, 900, 1.7, true]]), (t) => W.prop.table(960, 980, 1.25, M.hallSage) + W.prop.bowl(700, 770, 1) + W.prop.bowl(960, 770, 1) + W.prop.bowl(1220, 770, 1)],
  ['Prison corridor', 'prisonTeal · bg.corridor', (t) => W.bg.corridor(M.prisonTeal, { t }), ppl([[{ outfit: 'guard', item: 'spear' }, 560, 960, 1.5], [{ outfit: 'rags' }, 860, 960, 1.4], [{ outfit: 'rags' }, 1080, 960, 1.4], [{ outfit: 'rags' }, 1300, 960, 1.4]])],
  ['Stone room (blue-grey)', 'stoneBlue · bg.stoneRoom + window, table', (t) => W.bg.stoneRoom(M.stoneBlue, { seed: 3 }) + W.prop.window(480, 600, 1, M.stoneBlue, true), ppl([[{ outfit: 'robe', facial: 'beard', item: 'bread', expr: 'happy' }, 1100, 900, 1.8]]), (t) => W.prop.table(1100, 1060, 1.3, M.stoneBlue) + W.prop.cup(1350, 840, 1)],
  ['Snow town (establishing)', 'snowCold · bg.snowTown', (t) => W.bg.snowTown(M.snowCold, {}), []],
  ['Spring field', 'fieldSpring · bg.field', (t) => W.bg.field(M.fieldSpring, {}), ppl([[{ outfit: 'peasant', hair: 'short', hat: 'straw' }, 760, 900, 1.5], [{ age: 'child', outfit: 'dress', hair: 'ponytail', hairColor: 'blond', color: '#D98C7A' }, 980, 900, 1.5]])],
  ['Hospital ward', 'hospitalMint · bg.ward', (t) => W.bg.ward(M.hospitalMint, {}), ppl([[{ outfit: 'scrubs', hair: 'bun', hairColor: 'black', expr: 'joy' }, 820, 840, 1.6]])],
  ['Infographic', 'infoPaper · bg.paper + info.bone/arrow/crack/impact + HTML labels', (t) => W.bg.paper(M.infoPaper) + W.info.bone(600, 560, 1, -25) + W.info.crack(560, 640, 1.2) + W.info.arrow(840, 560, 1060, 560) + W.info.bone(1380, 560, 1, -25) + W.info.impact(1420, 560, 1) + W.info.leader(660, 600, 820, 360, 60), [], null, () => W.info.labelHTML('Healed 3 years ago', 760, 220, { size: 70, width: 420 }) + W.info.labelHTML('Broke again', 1500, 200, { size: 70, width: 360 })],
  ['Map', 'mapSea · bg.sea + style.land + info.pin + HTML labels', (t) => W.bg.sea(M.mapSea) + W.style.land('M300 300 Q520 180 760 260 Q860 420 760 560 Q620 760 520 640 Q360 520 300 300 Z') + W.style.land('M1000 220 Q1400 120 1700 260 Q1760 480 1560 600 Q1300 720 1120 560 Q960 420 1000 220 Z') + W.info.pin(560, 440) + W.info.pin(1360, 380), [], null, () => W.info.labelHTML('West Africa', 470, 470, { size: 60 }) + W.info.labelHTML('China', 1300, 300, { size: 60 })],
  ['Cutaway close-up', 'infoPaper · info.wound / info.blob (stylised, no gore)', (t) => '<rect width="1920" height="1080" style="fill:#F7EDEA"/><path d="M200 420 L1720 380 V1080 H200 Z" style="fill:#F2C3A0;stroke:#2A2522;stroke-width:4"/><path d="M200 560 Q960 520 1720 540 V1080 H200 Z" style="fill:#F6E3CF;stroke:#2A2522;stroke-width:4"/>' + W.info.blob(700, 470, 70, '#B24B3E', 2) + W.info.blob(1180, 480, 110, '#B24B3E', 5) + W.info.blob(1000, 760, 90, '#B24B3E', 7) + W.info.pointer(1280, 240, 1080, 620), [], null, () => W.info.labelHTML('Capillary failure', 1180, 140, { size: 70 })],
];
const grid = document.getElementById('grid'), live = [];
scenes.forEach(([name, sub, bg, people, fg, html]) => {
  const card = document.createElement('div'); card.className = 'card';
  card.innerHTML = '<div class="frame"><div class="stage"><svg viewBox="0 0 1920 1080"><g class="bg"></g><g class="pp">' + people.map((p) => p.svg).join('') + '</g><g class="fg"></g></svg>' + (html ? html() : '') + '</div></div><div class="cap"><b>' + name + '</b><small>' + sub + '</small></div>';
  grid.appendChild(card);
  const stage = card.querySelector('.stage');
  const ms = people.map((p) => ({ p, m: W.bindPerson(card, p.c) }));
  live.push({ card, stage, bg, fg, ms, gbg: card.querySelector('.bg'), gfg: card.querySelector('.fg') });
});
function fit() { live.forEach((L) => { L.stage.style.transform = 'scale(' + L.card.querySelector('.frame').clientWidth / 1920 + ')'; }); }
addEventListener('resize', fit); fit();
let last = -1;
function frame(ms) {
  const t = ms / 1000, step = Math.floor(t * 12);
  live.forEach((L, i) => {
    if (step !== last) { L.gbg.innerHTML = L.bg(t); if (L.fg) L.gfg.innerHTML = L.fg(t); }
    L.ms.forEach(({ p, m }, j) => W.posePerson(m, { x: p.x, y: p.y, s: p.s, flip: p.flip, head: Math.sin(t * 2 + j) * 1.5, expr: p.o.expr || 'neutral', blink: W.blinkAt((t + j * 0.9) % 3.4, [3.2]), a1: p.o.item === 'spear' ? -30 : -8, a2: p.o.item === 'spear' ? 20 : -6 }));
  });
  last = step; requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body></html>
